name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its older checks that are still running.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Every text on screen is translatable and has Kiswahili
        run: npm run i18n:check
      - name: No `any` types
        run: npm run types:check
      - name: Stylesheets mirror for right-to-left languages
        run: npm run rtl:check

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Every server message has Kiswahili
        run: python -m app.i18n.check
      - name: Check migrations match the models
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:////tmp/migration-check.db
        run: |
          flask --app run.py db upgrade
          flask --app run.py db check

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mechanic_pro
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Migrate, seed, and check migrations on PostgreSQL
        run: |
          python seed.py
          python seed.py
          flask --app run.py db check
      - name: Run the full test suite on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mechanic_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database mechanic_test"
          pytest -q

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    # A run takes a few minutes; a stuck browser install shouldn't hold the checks for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      - name: Run browser tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  windows:
    # Follows the Windows (PowerShell) steps in SETUP.md exactly.
    runs-on: windows-latest
    # Usually 20 to 30 minutes: Windows runners take 13 to 20 minutes for the backend tests alone.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend setup from SETUP.md
        working-directory: backend
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          py --version
          py -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements-dev.txt
          Copy-Item .env.example .env
          py seed.py
          pytest -q
      - name: Frontend setup from SETUP.md
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          Copy-Item .env.example .env.local
          npm run build
      - name: Browser tests on Windows
        working-directory: frontend
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          npx playwright install chromium
          $env:E2E_PYTHON = (Resolve-Path ..\backend\.venv\Scripts\python.exe).Path
          npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
