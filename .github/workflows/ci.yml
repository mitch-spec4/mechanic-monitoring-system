name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app run.py seed.py
      - name: Seed demo database
        run: python seed.py
      - name: Smoke test health and demo login
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          client = app.test_client()
          health = client.get("/api/health")
          assert health.status_code == 200, health.get_data(as_text=True)
          assert health.get_json().get("status") == "ok"

          login = client.post(
              "/api/auth/login",
              json={"email": "james@mechanicpro.test", "password": "password"},
          )
          assert login.status_code == 200, login.get_data(as_text=True)
          assert login.get_json().get("token")
          print("Health and demo login smoke tests passed.")
          PY
